<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoStim — Stay Focused</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      text-align: center;
      max-width: 420px;
      padding: 48px 32px;
    }

    .shield {
      font-size: 64px;
      margin-bottom: 24px;
      display: block;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }

    .blocked-site {
      display: inline-block;
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 15px;
      color: #f44336;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .timer {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
    }

    .timer span {
      color: #4caf50;
      font-weight: 600;
    }

    .break-btn {
      padding: 10px 24px;
      border: 1px solid #333;
      border-radius: 8px;
      background: transparent;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .break-btn:hover {
      border-color: #4caf50;
      color: #4caf50;
    }

    .break-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="shield">&#128737;</span>
    <h1>Stay focused!</h1>
    <div class="blocked-site" id="site-name"></div>
    <p class="timer">You've been focused for <span id="elapsed">0:00</span></p>
    <button class="break-btn" id="break-btn">Take a 5-minute break</button>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
